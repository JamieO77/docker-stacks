version: '3.8'

services:
  # 1. OpenClaw Agent Gateway
  openclaw_gateway:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw_gateway
    restart: unless-stopped
    ports:
      - "18789:18789"
    volumes:
      - openclaw_config:/home/node/.openclaw
      - openclaw_workspace:/home/node/openclaw/workspace
    environment:
      - TZ=Europe/Lisbon

volumes:
  openclaw_config:
  openclaw_workspace:
